name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Ascube.Mwm.slnx

      - name: Build
        run: dotnet build Ascube.Mwm.slnx --configuration Release --no-restore

      # ⚠ DcmtkCharsetVerificationTests は DCMTK(findscu/dcmdump)を外部プロセスとして呼ぶ。
      #    GitHubランナーにDCMTKは入っておらず、このテストは「PATHに無ければ例外で失敗」する
      #    設計（規則19：fo-dicomのdecoderに頼らず別実装で検証する）なのでCIからは除外する。
      #    ⚠ 文字コードの規格適合はCIでは検証されない。開発機でのDCMTK実行が引き続き正本。
      - name: Test (DCMTK依存テストを除く)
        run: dotnet test Ascube.Mwm.slnx --configuration Release --no-build --filter "FullyQualifiedName!~DcmtkCharsetVerificationTests" --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
